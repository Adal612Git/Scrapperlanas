            --neon-orange: #ff7300;
            --dark-bg: #0a0a14;
            --card-bg: rgba(20, 20, 40, 0.9);
            --card-border: rgba(0, 255, 157, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #b0b0ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--dark-bg);
            font-family: 'Courier New', monospace;
            color: var(--text-primary);
            overflow-x: hidden;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            border-bottom: 2px solid var(--neon-green);
        }

        h1 {
            color: var(--neon-green);
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--neon-green);
        }

        .subtitle {
            color: var(--neon-blue);
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            padding: 25px;
            cursor: move;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            min-height: 200px;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 25px var(--card-border);
            border-color: var(--neon-green);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 255, 157, 0.2);
        }

        .card-title {
            font-size: 1.4rem;
            color: var(--neon-green);
            font-weight: bold;
        }

        .card-icon {
            font-size: 1.8rem;
        }

        .card-content {
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .card.expanded .card-content {
            display: block;
        }

        .expand-btn {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .expand-btn:hover {
            background: var(--neon-blue);
            color: var(--dark-bg);
        }

        .details-panel {
            background: rgba(20, 20, 40, 0.95);
            border: 2px solid var(--neon-purple);
            border-radius: 12px;
            padding: 30px;
            margin-top: 40px;
            display: none;
        }

        .details-panel.active {
            display: block;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .neon-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .badge-green { background: rgba(0, 255, 157, 0.2); color: var(--neon-green); }
        .badge-blue { background: rgba(0, 217, 255, 0.2); color: var(--neon-blue); }
        .badge-purple { background: rgba(157, 0, 255, 0.2); color: var(--neon-purple); }
        .badge-pink { background: rgba(255, 0, 200, 0.2); color: var(--neon-pink); }
        .badge-orange { background: rgba(255, 115, 0, 0.2); color: var(--neon-orange); }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .metric-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid var(--neon-green);
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--neon-green);
            margin: 10px 0;
        }

        .architecture-diagram {
            width: 100%;
            height: 400px;
            background: linear-gradient(45deg, rgba(0,255,157,0.1), rgba(0,217,255,0.1));
            border-radius: 12px;
            margin: 30px 0;
            position: relative;
            overflow: hidden;
        }

        .node {
            position: absolute;
            background: var(--card-bg);
            border: 2px solid;
            border-radius: 8px;
            padding: 15px;
            width: 180px;
            text-align: center;
        }

        .draggable {
            cursor: move;
            user-select: none;
        }

        .line {
            position: absolute;
            background: var(--neon-blue);
            height: 2px;
            transform-origin: left center;
        }

        .color-green { border-color: var(--neon-green); }
        .color-blue { border-color: var(--neon-blue); }
        .color-purple { border-color: var(--neon-purple); }
        .color-pink { border-color: var(--neon-pink); }
        .color-orange { border-color: var(--neon-orange); }
    </style>
</head>

                card.setAttribute('data-key', key);
                card.style.borderColor = getColor(data.color);
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title">${data.icon} ${data.title}</div>
                        <div class="card-icon">${data.icon}</div>
                    </div>
                    <div class="card-content">
                        ${getPreviewContent(data.content)}
                    </div>
                    <button class="expand-btn" onclick="showDetails('${key}')">
                        Ver Análisis Detallado →
                    </button>
                `;
                
                container.appendChild(card);
            });
            
            // Initialize drag and drop
            initDragAndDrop();
            // Draw entity diagram
            drawEntityDiagram();
        }
        
        function getColor(colorName) {
            const colors = {
                green: '#00ff9d',
                blue: '#00d9ff',
                purple: '#9d00ff',
                pink: '#ff00c8',
                orange: '#ff7300'
            };
            return colors[colorName] || colors.green;
        }
        
        function getPreviewContent(content) {
            // Extract first paragraph or list for preview
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            const firstElem = tempDiv.firstElementChild;
            return firstElem ? firstElem.outerHTML : content.substring(0, 150) + '...';
        }
        
        function showDetails(key) {
            const data = architectureData[key];
            const panel = document.getElementById('detailsPanel');
            
            panel.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="color: ${getColor(data.color)};">${data.icon} ${data.title}</h2>
                    <button onclick="hideDetails()" style="background:transparent; border:1px solid var(--neon-pink); color:var(--neon-pink); padding:8px 16px; border-radius:6px; cursor:pointer;">
                        ✕ Cerrar
                    </button>
                </div>
                <div>${data.content}</div>
            `;
            
            panel.classList.add('active');
            panel.scrollIntoView({ behavior: 'smooth' });
        }
        
        function hideDetails() {
            document.getElementById('detailsPanel').classList.remove('active');
        }
        
        function initDragAndDrop() {
            const draggables = document.querySelectorAll('.draggable');
            const container = document.getElementById('cardsContainer');
            
            draggables.forEach(draggable => {
                draggable.addEventListener('mousedown', (e) => {
                    const shiftX = e.clientX - draggable.getBoundingClientRect().left;
                    const shiftY = e.clientY - draggable.getBoundingClientRect().top;
                    
                    function moveAt(pageX, pageY) {
                        draggable.style.left = pageX - shiftX + 'px';
                        draggable.style.top = pageY - shiftY + 'px';
                        draggable.style.position = 'absolute';
                    }
                    
                    function onMouseMove(event) {
                        moveAt(event.pageX, event.pageY);
                    }
                    
                    document.addEventListener('mousemove', onMouseMove);
                    
                    draggable.addEventListener('mouseup', () => {
                        document.removeEventListener('mousemove', onMouseMove);
                    }, { once: true });
                });
                
                draggable.ondragstart = () => false;
            });
        }
        
        function drawEntityDiagram() {
            const diagram = document.getElementById('entityDiagram');
            if (!diagram) return;
            
            // Clear and set dimensions
            diagram.innerHTML = '';
            
            // Define nodes
            const nodes = [
                { id: 'opportunity', x: 100, y: 150, label: 'Opportunity', color: 'green' },
                { id: 'user', x: 400, y: 50, label: 'User', color: 'blue' },
                { id: 'ai_model', x: 400, y: 250, label: 'AI Model', color: 'purple' },
                { id: 'proxy', x: 100, y: 300, label: 'Proxy Node', color: 'orange' },
                { id: 'platform', x: 400, y: 350, label: 'Platform', color: 'pink' }
            ];
            
            // Define connections
            const connections = [
                { from: 'opportunity', to: 'user', label: 'N:M' },
                { from: 'ai_model', to: 'opportunity', label: '1:N' },
                { from: 'proxy', to: 'platform', label: 'N:M' },
                { from: 'opportunity', to: 'platform', label: 'N:1' }
            ];
            
            // Draw connections first (so they're behind nodes)
            connections.forEach(conn => {
                const fromNode = nodes.find(n => n.id === conn.from);
                const toNode = nodes.find(n => n.id === conn.to);
                
                if (fromNode && toNode) {
                    const line = document.createElement('div');
                    line.className = 'line';
                    
                    const dx = toNode.x - fromNode.x;
                    const dy = toNode.y - fromNode.y;
                    const length = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                    
                    line.style.width = length + 'px';
                    line.style.left = (fromNode.x + 90) + 'px';
                    line.style.top = (fromNode.y + 45) + 'px';
                    line.style.transform = `rotate(${angle}deg)`;
                    
                    diagram.appendChild(line);
                }
            });
            
            // Draw nodes
            nodes.forEach(node => {
                const nodeEl = document.createElement('div');
                nodeEl.className = `node color-${node.color}`;
                nodeEl.style.left = node.x + 'px';
                nodeEl.style.top = node.y + 'px';
                nodeEl.textContent = node.label;
                diagram.appendChild(nodeEl);
            });
        }
        
        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', () => {
            initCards();
            
            // Add some dynamic metrics update simulation
            setInterval(() => {
                // Simulate real-time updates
                const metrics = document.querySelectorAll('.metric-value');
                metrics.forEach(metric => {
                    if (Math.random() > 0.7) {
                        const current = metric.textContent;
                        const value = parseFloat(current.replace(/[^0-9.]/g, ''));
                        if (!isNaN(value)) {
                            const change = (Math.random() - 0.5) * value * 0.1;
                            const newValue = value + change;
                            metric.textContent = metric.textContent.replace(
                                value.toFixed(1), 
                                newValue.toFixed(1)
                            );
                        }
                    }
                });
            }, 5000);
        });
    </script>
</body>
